[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-genre-classifier"
version = "0.2.0"
description = "GTZAN music genre classification (MFCC + CNN) — portfolio package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SS-Actinium" }]
dependencies = [
  "numpy>=1.24,<3",
  "librosa>=0.10,<0.12",
  "soundfile>=0.12",
  "scikit-learn>=1.3",
  "tensorflow>=2.15,<2.20",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
music-genre = "music_genre.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
