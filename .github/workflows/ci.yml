name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight deps (no TensorFlow in unit CI)
        run: |
          python -m pip install --upgrade pip
          pip install numpy librosa soundfile scikit-learn pytest fastapi httpx

      - name: Unit tests
        run: pytest -q

      - name: Smoke
        run: python scripts/smoke.py
